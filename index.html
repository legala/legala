<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Составление заявления</title>
  <!-- Подключаем шрифт Caveat для текста заявления -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">
  <!-- Подключаем шрифт Roboto для остальных элементов -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Ponomar&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat'; /* Шрифт Roboto для всего тела */
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100%;
    }

    .output-container, .form-container {
      padding: 20px;
      box-sizing: border-box;
      background-color: #1e1e1e;
      display: flex;
      flex-direction: column;
    }

    .output-container {
      border-right: 1px solid #333;
      align-items: center;
      justify-content: flex-start;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      font-family: 'Amatic SC', cursive; /* Шрифт Amatic SC для заголовков */
      font-size: 36px;
    }

    .output-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      flex-grow: 1;
      width: 100%;
      margin-top: 25%;
    }

    .textarea-container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      min-height: 200px;
    }

    /* Используем шрифт Caveat только для текста заявления */
    textarea {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      resize: none;
      border: none;
      background-color: #2c2c2c;
      border-radius: 4px;
      padding: 15px;
      font-size: 28px;
      color: #e0e0e0;
      line-height: 1.5;
      font-family: 'Caveat', cursive; /* Шрифт Caveat только для текста заявления */
      text-align: center;
      display: block;
      min-height: 200px;
      background: transparent;
      position: absolute;
    }

    textarea::placeholder {
      color: #888;
      text-align: center;
      line-height: normal;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #bbb;
    }

    input, select {
      width: 100%;
      padding: 10px 15px;
      font-size: 16px;
      border: 1px solid #333;
      border-radius: 4px;
      box-sizing: border-box;
      background-color: #2c2c2c;
      color: #e0e0e0;
      font-family: inherit;
    }

    input:focus, select:focus {
      border-color: #007BFF;
      outline: none;
      background-color: #3a3a3a;
    }

    /* Заголовок для формы остается с шрифтом Roboto */
    h2 {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #fff;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }

      .output-container {
        border-right: none;
        border-bottom: 1px solid #333;
      }

      .form-container {
        margin-top: 20px;
      }

      textarea {
        min-height: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="output-container">
      <h2>Текст заявления</h2>
      <div class="output-wrapper">
        <div class="textarea-container">
          <textarea id="output" readonly>
            Тут будет текст заявления
          </textarea>
        </div>
      </div>
    </div>
    <div class="form-container">
      <h2>Форма для заполнения</h2>
      <form id="form">
        <div class="form-group">
          <label for="when">Когда произошло преступление?</label>
          <input type="text" id="when" placeholder="Пример: 01 января 2000 г. в 12:00 или с 12:00 01 января 2000 г. по 12:00 02 января 2000 г.">
        </div>
        <div class="form-group">
          <label for="where">Где случилось преступление?</label>
          <input type="text" id="where" placeholder="Пример: В моей квартире, по ул. Пушкина, г. Москва">
        </div>
        <div class="form-group">
          <label for="who">Кто совершил преступление?</label>
          <input type="text" id="who" placeholder="Пример: Злодеев Владимир Владимирович">
        </div>
        <div class="form-group">
          <label for="traits">Приметы</label>
          <input type="text" id="traits" placeholder="(не обязательно)">
        </div>
        <div class="form-group">
          <label for="composition">Если преступник был не один, то в каком составе?</label>
          <select id="composition">
            <option value="">Преступник был один</option>
            <option value="группы лиц">группы лиц</option>
            <option value="группы лиц по предварительному сговору">группы лиц по предварительному сговору</option>
            <option value="организованной группы">организованной группы</option>
          </select>
        </div>
        <div class="form-group">
          <label for="motive">Какой мотив, по вашему мнению, был у преступника?</label>
          <input type="text" id="motive" placeholder="Пример: получить удовлетворение; обогатиться">
        </div>
        <div class="form-group">
          <label for="event">Какое преступление было совершено?</label>
          <input type="text" id="event" placeholder="Пример: открытое хищение; ложный донос; оставление в опасности">
        </div>
        <div class="form-group">
          <label for="consequences">Какой ущерб был нанесен?</label>
          <input type="text" id="consequences" placeholder="Пример: материальный ущерб в крупном размере; тяжкие телесные повреждения; моральный вред">
        </div>
        <div class="form-group">
          <label for="evidence">Перечислите доказательства, которые могут подтвердить произошедшее?</label>
          <input type="text" id="evidence" placeholder="Пример: видеозаписи, очевидцы, правовые акты">
        </div>
        <div class="form-group">
          <label for="law">Какая статья УК была нарушена?</label>
          <input type="text" id="law" placeholder="Сравните текст УК РФ и вашу ситуацию, выбирите подходящее">
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const output = document.getElementById('output');

    form.addEventListener('input', () => {
      const when = document.getElementById('when').value || 'КОГДА';
      const where = document.getElementById('where').value || 'ГДЕ';
      const who = document.getElementById('who').value || 'КТО';
      const traits = document.getElementById('traits').value ? `(${document.getElementById('traits').value})` : '';
      const composition = document.getElementById('composition').value ? `(${document.getElementById('composition').value})` : '';
      const motive = document.getElementById('motive').value || 'МОТИВОМ';
      const event = document.getElementById('event').value || 'СОБЫТИЕ';
      const consequences = document.getElementById('consequences').value || 'ПОСЛЕДСТВИЯ';
      const evidence = document.getElementById('evidence').value || 'ДОКАЗАТЕЛЬСТВАМИ';
      const law = document.getElementById('law').value || 'УК';

      output.value = `${when} ${where} ${who} ${traits} ${composition} руководствуясь ${motive} совершил ${event}, нанеся тем самым ${consequences}, таким образом нарушив ${law}, что подтверждается ${evidence}.`;
    });
  </script>
</body>
</html>
