<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>яНЯРЮБКЕМХЕ ГЮЪБКЕМХЪ (ой БЕПЯХЪ)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100%;
    }
    .output-container, .form-container {
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      background-color: #fff;
    }
    .output-container {
      border-right: 1px solid #e0e0e0;
    }
    textarea {
      width: 100%;
      height: calc(100% - 40px);
      box-sizing: border-box;
      resize: none;
      border: none;
      background-color: #f5f5f5;
      border-radius: 4px;
      padding: 15px;
      font-size: 16px;
      color: #333;
      line-height: 1.5;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #555;
    }
    input, select {
      width: 100%;
      padding: 10px 15px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      background-color: #f9f9f9;
      color: #333;
      font-family: inherit;
    }
    input:focus, select:focus {
      border-color: #007BFF;
      outline: none;
      background-color: #fff;
    }
    h2 {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="output-container">
      <h2>рЕЙЯР ГЮЪБКЕМХЪ</h2>
      <textarea id="output" readonly>
йнцдю цде йрн (опхлерш ) (янярюб )ПСЙНБНДЯРБСЪЯЭ лнрхбнл ЯНБЕПЬХК янашрхе, МЮМЕЯЪ РЕЛ ЯЮЛШЛ онякедярбхъ, РЮЙХЛ НАПЮГНЛ МЮПСЬХБ сй, ВРН ОНДРБЕПФДЮЕРЯЪ днйюгюрекэярбюлх.
      </textarea>
    </div>
    <div class="form-container">
      <h2>тНПЛЮ ДКЪ ГЮОНКМЕМХЪ</h2>
      <form id="form">
        <div class="form-group">
          <label for="when">йНЦДЮ ОПНХГНЬКН ЯНАШРХЕ?</label>
          <input type="text" id="when" placeholder="оПХЛЕП: 2024-12-22 14:00 ХКХ 2024-12-22 14:00 - 2024-12-23 18:00">
        </div>
        <div class="form-group">
          <label for="where">цДЕ Я БЮЛХ ЯКСВХКНЯЭ ЩРН ЯНАШРХЕ?</label>
          <input type="text" id="where" placeholder="оПХЛЕП: сКХЖЮ оСЬЙХМЮ, ЦНПНД лНЯЙБЮ">
        </div>
        <div class="form-group">
          <label for="who">йРН ЯНБЕПЬХК ЩРН ДЕИЯРБХЕ?</label>
          <input type="text" id="who" placeholder="бБЕДХРЕ ХЛЪ ХКХ НОХЯЮМХЕ ГКНСЛШЬКЕММХЙЮ">
        </div>
        <div class="form-group">
          <label for="traits">(оПХЛЕРШ)</label>
          <input type="text" id="traits" placeholder="бБЕДХРЕ ОПХЛЕРШ (ЕЯКХ ЕЯРЭ)">
        </div>
        <div class="form-group">
          <label for="composition">(яНЯРЮБ)</label>
          <select id="composition">
            <option value="">мЕР НРБЕРЮ</option>
            <option value="ЦПСООШ КХЖ">ЦПСООШ КХЖ</option>
            <option value="ЦПСООШ КХЖ ОН ОПЕДБЮПХРЕКЭМНЛС ЯЦНБНПС">ЦПСООШ КХЖ ОН ОПЕДБЮПХРЕКЭМНЛС ЯЦНБНПС</option>
            <option value="НПЦЮМХГНБЮММНИ ЦПСООШ">НПЦЮМХГНБЮММНИ ЦПСООШ</option>
          </select>
        </div>
        <div class="form-group">
          <label for="motive">йЮЙНБ, ОН БЮЬЕЛС ЛМЕМХЧ, АШК ЛНРХБ?</label>
          <input type="text" id="motive" placeholder="бБЕДХРЕ ОПЕДОНКЮЦЮЕЛШИ ЛНРХБ">
        </div>
        <div class="form-group">
          <label for="event">вРН ОПНХГНЬКН?</label>
          <input type="text" id="event" placeholder="нОХЬХРЕ ЯНАШРХЕ">
</div>
        <div class="form-group">
          <label for="consequences">йЮЙХЕ АШКХ ОНЯКЕДЯРБХЪ?</label>
          <input type="text" id="consequences" placeholder="нОХЬХРЕ ОНЯКЕДЯРБХЪ">
        </div>
        <div class="form-group">
          <label for="evidence">йЮЙХЕ С БЮЯ ЕЯРЭ ДНЙЮГЮРЕКЭЯРБЮ?</label>
          <input type="text" id="evidence" placeholder="нОХЬХРЕ ХЛЕЧЫХЕЯЪ ДНЙЮГЮРЕКЭЯРБЮ">
        </div>
        <div class="form-group">
          <label for="law">йЮЙЮЪ ЯРЮРЭЪ сй АШКЮ МЮПСЬЕМЮ?</label>
          <input type="text" id="law" placeholder="бБЕДХРЕ ЯРЮРЭЧ ХКХ НОХЯЮМХЕ">
        </div>
      </form>
    </div>
  </div>

<script>
  const form = document.getElementById('form');
  const output = document.getElementById('output');

  // дНАЮБКЪЕЛ НАПЮАНРВХЙ ЯНАШРХИ
  form.addEventListener('input', () => {
    // оНКСВЮЕЛ ГМЮВЕМХЪ БЯЕУ ОНКЕИ ТНПЛШ
    const when = document.getElementById('when').value || 'йнцдю';
    const where = document.getElementById('where').value || 'цде';
    const who = document.getElementById('who').value || 'йрн';
    const traits = document.getElementById('traits').value ? (${document.getElementById('traits').value})  : '';
    const composition = document.getElementById('composition').value ? (${document.getElementById('composition')})  : '';
    const motive = document.getElementById('motive').value || 'лнрхбнл';
    const event = document.getElementById('event').value || 'янашрхе';
    const consequences = document.getElementById('consequences').value || 'онякедярбхъ';
    const evidence = document.getElementById('evidence').value || 'днйюгюрекэярбюлх';
    const law = document.getElementById('law').value || 'сй';

    // нАМНБКЪЕЛ РЕЙЯР ГЮЪБКЕМХЪ
    output.value = ${when} ${where} ${who} ${traits}${composition}ПСЙНБНДЯРБСЪЯЭ ${motive} ЯНБЕПЬХК ${event}, МЮМЕЯЪ РЕЛ ЯЮЛШЛ ${consequences}, РЮЙХЛ НАПЮГНЛ МЮПСЬХБ ${law}, ВРН ОНДРБЕПФДЮЕРЯЪ ${evidence}.;
  });
</script>
</body>
</html>
